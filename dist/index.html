<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="google-site-verification" content="w73JoQh2tjo7AG4KXHLJuxpnewHQdGF-bsz5-0VEhQI" />
<title>NameDeck</title>
<meta name="theme-color" content="#0f1420" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NameDeck" />
<style>
:root {
  --card: #ffffff; --ink: #1a2233; --muted: #7a869a; --accent: #5B8DEF; --line: #e7ebf2;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Reserve the scrollbar's space so it appearing/disappearing (on zoom, pause, etc.)
   never changes the layout width and resizes the image. */
html { scrollbar-gutter: stable; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f4f6fb; color: var(--ink);
}
/* Phones / installed PWA: the app fills the whole screen — no mockup frame. */
.phone {
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  background: #f4f6fb; overflow: hidden;
}
/* Pad by the device safe-area insets (notch/status bar, home indicator) so nothing hides
   under the iPhone bezel; the fallbacks keep it at a plain 12px in browsers with no insets. */
#app { flex: 1; display: flex; flex-direction: column;
  padding: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px))
           env(safe-area-inset-bottom, 12px) calc(12px + env(safe-area-inset-left, 0px)); }
.screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Wider screens: show it inside a centered phone mockup for a desktop preview. */
@media (min-width: 480px) {
  body {
    display: flex; justify-content: center; padding: 24px 12px; min-height: 100vh;
    background: radial-gradient(120% 80% at 50% -10%, #1b2740 0%, #0f1420 60%);
  }
  .phone {
    width: 100%; max-width: 390px; min-height: 720px; border-radius: 34px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 0 0 8px #000;
  }
}

/* Icon buttons — roster (left) and settings (right) live in the bottom bar. */
.iconbtn {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; background: none; color: var(--ink); cursor: pointer;
}
.iconbtn:active { transform: scale(.94); }

.close { border: none; background: none; font-size: 22px; line-height: 1; color: var(--muted);
  cursor: pointer; padding: 0 6px; }

/* Settings controls — white cards on the gray sheet body, like the roster rows. */
.control { background: var(--card); border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 1px 4px rgba(20,30,60,.08); }
.control + .control { margin-top: 10px; }
.control label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.control label b { color: var(--ink); }
.control input[type=range] { width: 100%; accent-color: var(--accent); }

/* Small muted "Privacy Policy" link at the bottom of the settings panel. */
.privacy-link { display: block; text-align: center; margin-top: 16px; font-size: 12.5px;
  color: var(--muted); text-decoration: underline; }

/* Card fills the screen; the image is the star. */
.card {
  flex: 1; display: flex; flex-direction: column;
  background: var(--card); border-radius: 22px; padding: 10px; text-align: center;
  box-shadow: 0 8px 26px rgba(20,30,60,.10); cursor: pointer;
}
.avatar { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
/* Empty state — shown in the card when no students have been added yet. */
.empty-deck { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 24px; text-align: center; }
.empty-title { font-size: 20px; font-weight: 800; color: var(--ink); }
.empty-sub { font-size: 14px; color: var(--muted); line-height: 1.5; max-width: 240px; }
.empty-deck .btn { margin-top: 6px; }
/* Fill the whole avatar area (absolutely, so no image can grow the layout); `contain`
   shows the entire photo as large as it fits, letterboxing where the shape differs. */
.avatar .photo, .avatar svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
}
.avatar .photo { object-fit: contain; background: #e7ebf2; }
/* Fixed height so the image above doesn't shift when the name replaces the hint. */
.name-slot { flex: 0 0 auto; height: 80px; display: flex; flex-direction: column;
  justify-content: center; padding: 8px 0 4px; }
.waiting { color: #c3ccdb; font-size: 15px; letter-spacing: .3px; }
.name { font-size: 30px; font-weight: 800; animation: pop .22s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Frequency selector (how often the current student appears) — shown while paused. */
.freq { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0 0; }
.freq[hidden] { display: none; }
.freq-label { font-size: 12px; color: var(--muted); }
.freq-picker { display: inline-flex; flex-direction: column; gap: 2px; }
.freq-seg { display: flex; background: #e7ebf2; border-radius: 10px; padding: 2px; gap: 2px; }
.freq-opt { flex: 1; border: none; background: none; color: var(--muted); cursor: pointer; font: inherit;
  min-width: 34px; padding: 5px 8px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.freq-opt.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20,30,60,.15); }
.freq-scale { display: flex; justify-content: space-between; padding: 0 5px; }
.freq-scale span { font-size: 10.5px; color: var(--muted); }

/* Playback controls (pause/continue + prev/next) below the card. */
/* Bottom bar: roster (left) | transport (center) | settings (right). */
.controls { flex: 0 0 auto; position: relative; z-index: 7; height: 68px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.controls[hidden] { display: none; }
.transport { display: flex; align-items: center; gap: 22px; }
.transport[hidden] { display: none; }
.ctrl { border: none; background: none; color: var(--ink); cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 50%; }
.ctrl:disabled { opacity: .28; cursor: default; }
.ctrl:not(:disabled):active { transform: scale(.94); }
.ctrl.play { width: 58px; height: 58px; background: var(--ink); color: #fff;
  box-shadow: 0 4px 14px rgba(20,30,60,.25); }

/* Roster/settings panels — fill from the top down to just above the bottom bar, so the
   roster/settings buttons in that bar stay visible (to switch panels or close). */
.sheet {
  position: absolute; top: 0; right: 0; bottom: 68px; left: 0; z-index: 6;
  display: flex; flex-direction: column;
  background: #f4f6fb; border-radius: 22px; overflow: hidden;
  box-shadow: 0 6px 18px rgba(20,30,60,.12);
}
.sheet[hidden] { display: none; }
.sheet-head, .sheet-foot { display: flex; align-items: center; padding: 14px 16px; background: var(--card); }
.sheet-head { justify-content: space-between; box-shadow: 0 1px 0 var(--line); }
.sheet-head span { font-weight: 800; font-size: 17px; }
.sheet-head .roster-count { font-weight: 600; font-size: 14px; color: var(--muted); }
.sheet-foot { justify-content: flex-end; gap: 10px; box-shadow: 0 -1px 0 var(--line); }
.sheet-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
#nameInput { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  font: inherit; resize: vertical; }
#addNames { width: 100%; margin-top: 10px; }
/* Import panel is grouped into named sections (Named Photos / Local Google / Google Drive / backup),
   each separated by a rule with a title + one-line description. */
.import-section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.import-section:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
.section-title { margin: 0 0 4px; font-size: 15px; font-weight: 800; color: var(--ink); }
.section-desc { margin: 0 0 4px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.section-desc b { color: var(--ink); }
.backup-actions { display: flex; gap: 10px; margin-top: 8px; }
.backup-actions .btn { flex: 1; text-align: center; }

/* Each import option: a full-width button with a one-line caption explaining when to use it. */
.import-method { margin-top: 12px; }
.import-method .btn { display: block; width: 100%; text-align: center; }
.import-caption { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.4; }

/* Post-import nudge toward the preferred-names step: a soft, dismissible banner (not a modal). */
.callout { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: #eef4ff; border: 1px solid #cfe0ff;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink); line-height: 1.4; }
.callout[hidden] { display: none; }
.callout-msg { flex: 1; min-width: 150px; }
.callout-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.callout-x { border: none; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; }
.import-status { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; font-size: 12.5px;
  line-height: 1.45; background: #eef1f7; color: var(--ink); }
.import-status[hidden] { display: none; }
.import-status.ok { background: #e7f6ec; color: #1b7a3d; }
.import-status.error { background: #fdecdc; color: #9a3412; }
.notice { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; font-size: 12.5px;
  line-height: 1.45; color: #9a3412; background: #fdecdc; }
.notice[hidden] { display: none; }

.btn { border: none; border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 600;
  cursor: pointer; background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(20,30,60,.12); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn.tiny { padding: 6px 10px; font-size: 13px; font-weight: 500; }
.btn.danger { background: #d1453b; color: #fff; }

/* In-app confirmation dialog (for Clear All / Reset All). */
.modal { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center;
  justify-content: center; padding: 24px; background: rgba(15,20,32,.45); }
.modal[hidden] { display: none; }
.modal-card { width: 100%; max-width: 300px; background: var(--card); border-radius: 18px;
  padding: 20px; box-shadow: 0 16px 40px rgba(20,30,60,.30); }
.modal-msg { margin: 0 0 16px; font-size: 15px; line-height: 1.5; color: var(--ink); text-align: center; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; text-align: center; }

.roster-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 8px; }
.rrow { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px;
  padding: 6px 8px; box-shadow: 0 1px 4px rgba(20,30,60,.08); }
.rthumb { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 9px; overflow: hidden;
  background: #e7ebf2; position: relative; display: flex; align-items: center; justify-content: center; }
.rthumb img, .rthumb svg { width: 100%; height: 100%; object-fit: cover; }
.rthumb-photo { position: absolute; inset: 0; } /* overlays the avatar; removed on load error */
.rname { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px;
  font: inherit; background: transparent; }
.rname[readonly] { cursor: default; }
.rname:not([readonly]) { border-color: var(--accent); outline: none; background: #fff; }
.pick { flex: 0 0 auto; }
.remove { flex: 0 0 auto; color: var(--muted); font-size: 16px; line-height: 1; padding: 6px 9px; }
</style>
</head>
<body>
  <div class="phone"><div id="app"></div></div>
  <script>
/* ===== src/core/avatar.js ===== */
// avatar.js — deterministic procedural avatars.
//
// Generates a distinct, repeatable SVG face from a seed string. Same seed -> same face.
// This stands in for a real photo in the prototype so we never handle a real person's
// image. In the native app, this is replaced by the (locally stored) student photo.

window.NameDeck = window.NameDeck || {};

(function () {
  // Simple deterministic string hash -> 32-bit int.
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // Seeded pseudo-random generator (mulberry32).
  function rng(seedInt) {
    let a = seedInt;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const BG        = ['#5B8DEF', '#EF7A5B', '#3FB68B', '#B65BEF', '#EFC15B', '#5BC7EF', '#EF5B9C', '#7A8B99'];
  const SKIN      = ['#F2D3B3', '#E5B98E', '#C68642', '#8D5524', '#5C3A21', '#FFE0BD'];
  const HAIR      = ['#2B2B2B', '#4A2E19', '#7A4B1E', '#B8860B', '#8B0000', '#D9D9D9', '#1A1A1A'];
  const pick = (arr, r) => arr[Math.floor(r() * arr.length)];

  // Returns an SVG string for the given seed.
  NameDeck.avatar = function (seed, size) {
    size = size || 160;
    const r = rng(hash(seed));
    const bg = pick(BG, r);
    const skin = pick(SKIN, r);
    const hair = pick(HAIR, r);
    const hairStyle = Math.floor(r() * 4); // 0 short, 1 flat-top, 2 curly, 3 bald-ish
    const hasBeard = r() > 0.6;
    const eyeType = Math.floor(r() * 3);
    const browRaise = r() > 0.5 ? -2 : 0;

    // Face geometry (viewBox 100x100)
    const cx = 50, cy = 54, fr = 26; // face center + radius

    let hairSvg = '';
    if (hairStyle === 0) {
      hairSvg = `<path d="M24 46 Q50 8 76 46 Q76 30 50 24 Q24 30 24 46 Z" fill="${hair}"/>`;
    } else if (hairStyle === 1) {
      hairSvg = `<rect x="24" y="22" width="52" height="20" rx="6" fill="${hair}"/>`;
    } else if (hairStyle === 2) {
      hairSvg = `<g fill="${hair}">
        <circle cx="30" cy="34" r="9"/><circle cx="42" cy="26" r="10"/>
        <circle cx="58" cy="26" r="10"/><circle cx="70" cy="34" r="9"/>
        <circle cx="50" cy="24" r="10"/></g>`;
    } else {
      hairSvg = `<path d="M26 42 Q50 30 74 42 Q70 34 50 32 Q30 34 26 42 Z" fill="${hair}" opacity="0.9"/>`;
    }

    const beardSvg = hasBeard
      ? `<path d="M${cx-fr+4} ${cy+6} Q${cx} ${cy+fr+12} ${cx+fr-4} ${cy+6} Q${cx} ${cy+fr} ${cx-fr+4} ${cy+6} Z" fill="${hair}" opacity="0.85"/>`
      : '';

    let eyesSvg;
    if (eyeType === 0) {
      eyesSvg = `<circle cx="41" cy="52" r="3" fill="#222"/><circle cx="59" cy="52" r="3" fill="#222"/>`;
    } else if (eyeType === 1) {
      eyesSvg = `<rect x="38" y="50" width="7" height="4" rx="2" fill="#222"/><rect x="55" y="50" width="7" height="4" rx="2" fill="#222"/>`;
    } else {
      eyesSvg = `<path d="M38 52 Q41 49 44 52" stroke="#222" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                 <path d="M56 52 Q59 49 62 52" stroke="#222" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    }

    const browsSvg = `<path d="M37 ${46+browRaise} q4 -2 8 0" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>
                      <path d="M55 ${46+browRaise} q4 -2 8 0" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>`;

    const smile = r() > 0.5;
    const mouthSvg = smile
      ? `<path d="M43 64 Q50 71 57 64" stroke="#7a3b2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
      : `<path d="M44 66 L56 66" stroke="#7a3b2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;

    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="avatar">
      <defs><clipPath id="cl-${hash(seed)}"><rect width="100" height="100" rx="16"/></clipPath></defs>
      <g clip-path="url(#cl-${hash(seed)})">
        <rect width="100" height="100" fill="${bg}"/>
        <circle cx="${cx}" cy="88" r="34" fill="#ffffff" opacity="0.18"/>
        <circle cx="${cx}" cy="${cy}" r="${fr}" fill="${skin}"/>
        ${beardSvg}
        <ellipse cx="${cx-fr+2}" cy="${cy+2}" rx="4" ry="6" fill="${skin}"/>
        <ellipse cx="${cx+fr-2}" cy="${cy+2}" rx="4" ry="6" fill="${skin}"/>
        ${hairSvg}
        ${browsSvg}
        ${eyesSvg}
        ${mouthSvg}
      </g>
    </svg>`;
  };
})();


/* ===== src/core/roster-store.js ===== */
// roster-store.js — persistence adapter for the teacher's OWN roster.
//
// The rest of the app treats a roster as a plain array of student objects
// ({ id, preferredName, photo, avatarSeed, wiki, weight }); this module is the only place that
// knows *where* that data is kept. Because photos are large, storage is split:
//   - METADATA (names, ids, avatar seeds, etc.) — small — lives in localStorage as JSON, so the
//     app can load and render instantly (synchronously).
//   - PHOTOS (downscaled JPEG data URLs) — large — live in IndexedDB, which holds hundreds of MB
//     (vs. localStorage's ~5 MB), so a full class of photos fits. Loaded asynchronously after the
//     first paint (see loadPhotos), just like the demo portraits.
//
// IndexedDB isn't available everywhere (e.g. jsdom in tests, some private modes), so every photo
// call falls back to a per-key localStorage store, and everything is wrapped to degrade quietly.

window.NameDeck = window.NameDeck || {};

(function () {
  var META_KEY = 'namedeck.roster.v1';        // roster metadata (NO photos) in localStorage
  var SEEDED_KEY = 'namedeck.seeded.v1';       // set once the first-run demo roster has been placed
  var PHOTO_PREFIX = 'namedeck.photo.';        // fallback per-photo localStorage keys
  var DB_NAME = 'namedeck', STORE = 'photos';
  var dbPromise = null;

  function hasIDB() { try { return !!window.indexedDB; } catch (e) { return false; } }

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }

  // ---- IndexedDB photo operations (id -> data URL) ----
  function idbGetAll() {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var out = {}, req = db.transaction(STORE, 'readonly').objectStore(STORE).openCursor();
        req.onsuccess = function () {
          var c = req.result;
          if (c) { out[c.key] = c.value; c.continue(); } else resolve(out);
        };
        req.onerror = function () { reject(req.error); };
      });
    });
  }
  function idbPut(id, url) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(url, id);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function idbDelete(id) {
    return openDB().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { resolve(); };
      });
    });
  }
  function idbClear() {
    return openDB().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).clear();
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { resolve(); };
      });
    });
  }

  // ---- localStorage fallback (tests / no-IndexedDB environments) ----
  function lsGetAll() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PHOTO_PREFIX) === 0) out[k.slice(PHOTO_PREFIX.length)] = localStorage.getItem(k);
      }
    } catch (e) { /* ignore */ }
    return out;
  }
  function lsPut(id, url) { try { localStorage.setItem(PHOTO_PREFIX + id, url); return true; } catch (e) { return false; } }
  function lsDelete(id) { try { localStorage.removeItem(PHOTO_PREFIX + id); } catch (e) { /* ignore */ } }
  function lsClear() {
    try {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(PHOTO_PREFIX) === 0) keys.push(k); }
      keys.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) { /* ignore */ }
  }

  // Keep only the small (non-photo) fields for localStorage metadata.
  function toMeta(s) {
    return { id: s.id, preferredName: s.preferredName, avatarSeed: s.avatarSeed, wiki: s.wiki, weight: s.weight };
  }

  NameDeck.rosterStore = {
    // Synchronous: the roster metadata (photos come back as null; fill them via loadPhotos()).
    load: function () {
      try {
        var raw = localStorage.getItem(META_KEY);
        var list = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(list)) return [];
        var migrated = false, store = this;
        var out = list.map(function (s) {
          // One-time migration from the old all-in-localStorage format: if a photo rode along in the
          // metadata, move it into the photo store (and keep showing it now) so upgrades don't lose it.
          if (s.photo) { store.savePhoto(s.id, s.photo); migrated = true; }
          return { id: s.id, preferredName: s.preferredName, avatarSeed: s.avatarSeed, wiki: s.wiki, weight: s.weight, photo: s.photo || null };
        });
        if (migrated) this.saveMeta(out); // rewrite metadata without photos, freeing up localStorage
        return out;
      } catch (e) { return []; }
    },
    saveMeta: function (list) {
      try { localStorage.setItem(META_KEY, JSON.stringify(list.map(toMeta))); return true; }
      catch (e) { return false; } // metadata is tiny, so this practically never fails
    },
    // Async photo store (IndexedDB, big) with a localStorage fallback.
    loadPhotos: function () {
      if (hasIDB()) return idbGetAll().catch(function () { return lsGetAll(); });
      return Promise.resolve(lsGetAll());
    },
    savePhoto: function (id, url) {
      if (hasIDB()) return idbPut(id, url).catch(function () { return lsPut(id, url); });
      return Promise.resolve(lsPut(id, url));
    },
    removePhoto: function (id) {
      if (hasIDB()) return idbDelete(id).catch(function () { lsDelete(id); });
      lsDelete(id);
      return Promise.resolve();
    },
    clear: function () {
      try { localStorage.removeItem(META_KEY); } catch (e) { /* ignore */ }
      lsClear();
      if (hasIDB()) idbClear().catch(function () {});
    },
    // Has the one-time demo roster already been seeded? Used so we place it only on the very
    // first launch and never re-add it after the user clears or edits their roster.
    seeded: function () {
      try { return localStorage.getItem(SEEDED_KEY) === '1'; } catch (e) { return false; }
    },
    markSeeded: function () {
      try { localStorage.setItem(SEEDED_KEY, '1'); } catch (e) { /* nothing to do */ }
    }
  };
})();


/* ===== src/ui/google-import.js ===== */
// google-import.js — optional "Import from Google" using Google Sign-In + the Picker with
// the narrow `drive.file` scope (per-file access only; no full-Drive access, no security audit).
//
// Flow: sign in (drive.file) -> Picker to select the responses spreadsheet AND the photos ->
// read the sheet (name + photo file ID per row) -> download each photo by ID -> hand back
// [{ preferredName, blob }] matched by file ID. Private (the teacher's own auth) and stored
// on-device by the app. The Google client libraries are loaded lazily on first use, so the
// app stays dependency-free and offline-capable until this feature is actually used.
//
// SETUP (only you can do this — see README "Google import"): create a Google Cloud project,
// enable the Picker API + Drive API, make an OAuth Client ID (Web) and an API key, then paste
// them below. Until both are filled in, the button explains it isn't configured yet.

window.NameDeck = window.NameDeck || {};

(function () {
  // ---- Paste your Google Cloud credentials here ----
  var CLIENT_ID = '905358747786-rs954olnn8q7sn51igv6sp21pdbu7ugg.apps.googleusercontent.com';
  var API_KEY = 'AIzaSyAk84A3wN67i4OW-BjuHHUiliiFpO90vf4';
  // --------------------------------------------------

  var SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var FOLDER_MIME = 'application/vnd.google-apps.folder';
  var NAME_HEADER = 'Preferred Full Name';   // must match your form's name question title
  var PHOTO_HEADER = 'Your Photo';           // must match your form's photo question title

  var pickerReady = false, tokenClient = null, accessToken = null;

  function configured() { return !!CLIENT_ID && !!API_KEY; }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.async = true; s.defer = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Could not load ' + src)); };
      document.head.appendChild(s);
    });
  }

  // Load Google Identity Services (auth) + gapi (Picker), once.
  function ensureLibs() {
    if (pickerReady) return Promise.resolve();
    return Promise.all([
      loadScript('https://accounts.google.com/gsi/client'),
      loadScript('https://apis.google.com/js/api.js')
    ]).then(function () {
      return new Promise(function (resolve) {
        gapi.load('picker', function () { pickerReady = true; resolve(); });
      });
    });
  }

  function ensureTokenClient() {
    if (!tokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: function () {} });
    }
  }

  // Get an OAuth access token for the drive.file scope: consent on the first sign-in of a page
  // session, then reuse it silently. NOTE: passing prompt:'' to skip that consent seemed smoother,
  // but it BROKE the Google Picker in Safari / installed PWAs — the silent flow never establishes
  // the first-party Google session the Picker needs, so it failed with "Can't access your Google
  // Account." The visible consent navigation primes that session, so we keep it (worth a repeat
  // sign-in in the native app to keep the Picker working everywhere).
  function getToken() {
    return new Promise(function (resolve, reject) {
      ensureTokenClient();
      tokenClient.callback = function (resp) {
        if (resp && resp.access_token) { accessToken = resp.access_token; resolve(accessToken); }
        else reject(new Error('Sign-in was cancelled'));
      };
      tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
    });
  }

  // Build + show a Picker; resolves with the selected docs (or null if cancelled).
  function buildPicker(token, opts) {
    return new Promise(function (resolve) {
      var b = new google.picker.PickerBuilder()
        .setOAuthToken(token)
        .setDeveloperKey(API_KEY)
        .setAppId(CLIENT_ID.split('-')[0]) // project number: grants drive.file access to picked files
        .setTitle(opts.title)
        .addView(opts.view)
        .setCallback(function (data) {
          var a = data[google.picker.Response.ACTION];
          if (a === google.picker.Action.PICKED) resolve(data[google.picker.Response.DOCUMENTS] || []);
          else if (a === google.picker.Action.CANCEL) resolve(null);
        });
      if (opts.multiselect) b.enableFeature(google.picker.Feature.MULTISELECT_ENABLED);
      b.build().setVisible(true);
    });
  }
  // Step 1: pick the responses spreadsheet (single).
  function pickSpreadsheet(token) {
    return buildPicker(token, {
      title: 'Step 1 of 2 — select your responses spreadsheet',
      view: new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
    }).then(function (docs) { return docs && docs[0]; });
  }
  // Step 2: pick the "<photo question> (File responses)" folder that directly holds the photos (for
  // the template that's "Your Photo (File responses)"), or open it and multi-select the photos.
  function pickPhotos(token) {
    return buildPicker(token, {
      title: 'Step 2 of 2 — pick the "' + PHOTO_HEADER + ' (File responses)" folder (it holds the photos)',
      multiselect: true,
      view: new google.picker.DocsView(google.picker.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(true)
    });
  }

  function authFetch(url, token) {
    return fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  }
  function httpError(label, r) {
    return r.text().then(function (t) {
      throw new Error(label + ' (HTTP ' + r.status + '): ' + String(t).slice(0, 300));
    });
  }
  function downloadFile(id, token) {
    return authFetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media', token)
      .then(function (r) { return r.ok ? r.blob() : httpError('Photo download failed', r); });
  }
  function exportSheetCsv(id, token) {
    return authFetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '/export?mimeType=text%2Fcsv', token)
      .then(function (r) { return r.ok ? r.text() : httpError('Could not read the spreadsheet', r); });
  }

  // Minimal RFC-4180-ish CSV parser (handles quoted fields, embedded commas/newlines).
  function parseCsv(text) {
    var rows = [], row = [], field = '', inQ = false, i = 0, c;
    for (; i < text.length; i++) {
      c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') { field += c; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Pull the Drive file ID out of a photo-response cell. Google Forms writes a Drive URL like
  // "https://drive.google.com/open?id=FILE_ID" (or ".../d/FILE_ID/..."); we target those forms
  // first so we never accidentally grab a long filename, then fall back to a bare ID-like token.
  function extractFileId(cell) {
    var s = String(cell || '');
    var m = s.match(/[?&]id=([-\w]{20,})/) || s.match(/\/(?:file\/)?d\/([-\w]{20,})/);
    if (m) return m[1];
    m = s.match(/[-\w]{25,}/);
    return m ? m[0] : null;
  }

  // From the responses CSV, produce [{ name, fileId }] using the name + photo columns.
  function pairsFromCsv(text) {
    var rows = parseCsv(text);
    if (rows.length < 2) return [];
    var header = rows[0].map(function (h) { return h.trim(); });
    var nameCol = header.indexOf(NAME_HEADER);
    var photoCol = header.indexOf(PHOTO_HEADER);
    if (nameCol < 0 || photoCol < 0) throw new Error('Could not find the "' + NAME_HEADER + '" / "' + PHOTO_HEADER + '" columns');
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var name = (rows[i][nameCol] || '').trim();
      var fileId = extractFileId(rows[i][photoCol]);
      if (name && fileId) out.push({ name: name, fileId: fileId });
    }
    return out;
  }

  // A short, human-readable preview of the names about to import (for the status line).
  function previewNames(pairs) {
    var names = pairs.map(function (p) { return p.name; });
    if (names.length <= 4) return names.join(', ');
    return names.slice(0, 3).join(', ') + ', and ' + (names.length - 3) + ' more';
  }
  // A fuller (one-per-line) list for the confirmation dialog, capped so it isn't enormous.
  function namesForConfirm(pairs) {
    var names = pairs.map(function (p) { return p.name; });
    if (names.length <= 20) return names.join('\n');
    return names.slice(0, 20).join('\n') + '\n… and ' + (names.length - 20) + ' more';
  }

  // Sign in + pick the sheet, read it (so we can show which students will import), then pick the
  // photos and resolve the accessible ones. Resolves with { token, folderPicked, students:[{
  // preferredName, fileId }] } — no downloading here. The web flow downloads inline (see run); the
  // native flow hands this back to the app, since the sign-in + Picker must run in a real browser.
  function collect(onStatus) {
    onStatus = onStatus || function () {};
    if (!configured()) return Promise.reject(new Error('Google import is not configured'));
    return ensureLibs().then(getToken).then(function (token) {
      return pickSpreadsheet(token).then(function (sheet) {
        if (!sheet) return { token: token, folderPicked: false, students: [] }; // cancelled
        onStatus('Reading responses…');
        return exportSheetCsv(sheet.id, token).then(function (csv) {
          var pairs = pairsFromCsv(csv);
          if (!pairs.length) {
            throw new Error('No students with photos were found in that spreadsheet — make sure you picked the form’s responses sheet.');
          }
          // Confirmation: show which class/names are about to import BEFORE choosing photos, so a
          // teacher with several classes can back out if they picked the wrong spreadsheet. The
          // photo picker opens right after, so a dialog (not just a status line) is what's visible.
          onStatus('Found ' + pairs.length + ' student' + (pairs.length === 1 ? '' : 's') + ': ' + previewNames(pairs));
          if (typeof confirm === 'function' &&
              !confirm('Import these ' + pairs.length + ' student' + (pairs.length === 1 ? '' : 's') + '?\n\n' +
                       namesForConfirm(pairs) + '\n\nClick OK, then choose the photos folder.')) {
            return { token: token, folderPicked: false, students: [] }; // teacher backed out
          }
          return pickPhotos(token).then(function (photoDocs) {
            if (!photoDocs) return { token: token, folderPicked: false, students: [] }; // cancelled
            var folderPicked = false, pickedIds = {};
            photoDocs.forEach(function (d) {
              if (d.mimeType === FOLDER_MIME) folderPicked = true;
              else if (/^image\//.test(d.mimeType || '')) pickedIds[d.id] = true;
            });
            // Folder picked → try every response's photo (the folder grant should allow it);
            // otherwise only the individually-selected photos.
            var candidates = pairs.filter(function (p) { return folderPicked || pickedIds[p.fileId]; });
            if (!candidates.length) {
              throw new Error(folderPicked
                ? 'No photos matched — is that the "(File responses)" folder for this form?'
                : 'None of the selected photos matched the responses');
            }
            return {
              token: token,
              folderPicked: folderPicked,
              students: candidates.map(function (p) { return { preferredName: p.name, fileId: p.fileId }; })
            };
          });
        });
      });
    });
  }

  NameDeck.googleImport = {
    configured: configured,
    // Warm up the Google libraries ahead of time (e.g. when the roster opens), so the first
    // click can open the sign-in popup within the user's tap — otherwise the async load loses
    // the tap gesture and the browser blocks the popup (you'd have to click twice).
    preload: function () {
      if (configured()) ensureLibs().then(ensureTokenClient).catch(function () {});
    },
    // Sign in + pick + read (no download). Used by the native handoff page.
    collect: collect,
    // Download one photo by Drive file ID with a token from collect(). Used by the native app
    // to finish the import after the handoff.
    downloadPhoto: function (fileId, token) { return downloadFile(fileId, token); },
    // Web flow: collect, then download the photos inline. Resolves with [{ preferredName, blob }].
    // onStatus(message) is called at each phase (for the in-app progress line).
    run: function (onStatus) {
      onStatus = onStatus || function () {};
      return collect(onStatus).then(function (res) {
        var candidates = res.students || [];
        if (!candidates.length) return { students: [], failed: 0, firstError: null };
        var total = candidates.length, done = 0, firstError = null;
        var tick = function () { done++; onStatus('Downloading photos… (' + done + ' of ' + total + ')'); };
        onStatus('Downloading photos… (0 of ' + total + ')');
        return Promise.all(candidates.map(function (p) {
          return downloadFile(p.fileId, res.token).then(
            function (blob) { tick(); return { preferredName: p.preferredName, blob: blob }; },
            function (err) { tick(); if (!firstError) firstError = err; return null; } // tolerate; keep the first error
          );
        })).then(function (results) {
          var students = results.filter(Boolean);
          // Return diagnostics too, so partial failures (some downloaded, some didn't) still surface
          // the real HTTP error instead of hiding it behind a "success" message.
          return {
            students: students,
            failed: total - students.length,
            firstError: firstError && firstError.message ? firstError.message : null
          };
        });
      });
    }
  };
})();


/* ===== src/ui/sheet-import.js ===== */
// sheet-import.js — read a teacher's DOWNLOADED responses sheet (a local file) and pull out the
// list of preferred names. No Google connection: this powers the "Local Google" flow, where the
// teacher has downloaded the responses spreadsheet unchanged and just selects it.
//
// Two formats are handled:
//   - CSV  — read as text and parsed directly (no dependency).
//   - XLSX — a ZIP of XML; unzipped with fflate (loaded lazily, only when an .xlsx is picked),
//            then the shared-strings table + first worksheet are read with the built-in DOMParser.
// Either way we end up with a 2-D array of rows and take the "Preferred Full Name" column.

window.NameDeck = window.NameDeck || {};

(function () {
  // Must match the form's name-question title (same as google-import.js NAME_HEADER).
  var NAME_HEADER = 'Preferred Full Name';

  function readText(file) {
    if (file.text) return file.text();
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result)); };
      r.onerror = function () { reject(r.error); };
      r.readAsText(file);
    });
  }
  function readArrayBuffer(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsArrayBuffer(file);
    });
  }

  // Lazily load the vendored fflate (ZIP) library, once. Resolves with the global it exposes.
  var fflateState = {};
  function loadFflate() {
    if (window.fflate) return Promise.resolve(window.fflate);
    if (fflateState.p) return fflateState.p;
    fflateState.p = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'vendor/fflate.min.js';
      s.onload = function () { resolve(window.fflate); };
      s.onerror = function () { fflateState.p = null; reject(new Error('Could not load the spreadsheet reader')); };
      document.head.appendChild(s);
    });
    return fflateState.p;
  }

  // Minimal RFC-4180-ish CSV parser (handles quoted fields, embedded commas/newlines).
  function parseCsv(text) {
    var rows = [], row = [], field = '', inQ = false, i = 0, c;
    for (; i < text.length; i++) {
      c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') { field += c; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // "B12" -> 1 (zero-based column index). Cell refs in xlsx carry their column letters.
  function colIndex(ref) {
    var m = /^([A-Z]+)/.exec(ref || '');
    if (!m) return -1;
    var s = m[1], n = 0;
    for (var i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
    return n - 1;
  }
  // Namespace-agnostic element lookup (real xlsx uses a default namespace, which a plain
  // getElementsByTagName can miss; matching by local name in any namespace is robust).
  function tags(node, name) {
    return node.getElementsByTagNameNS ? node.getElementsByTagNameNS('*', name) : node.getElementsByTagName(name);
  }
  function allText(el) { // concatenate every <t> under an element (handles rich-text runs)
    var ts = tags(el, 't'), out = '';
    for (var i = 0; i < ts.length; i++) out += ts[i].textContent;
    return out;
  }
  // Turn an unzipped xlsx (map of path -> Uint8Array) into a 2-D array of cell strings.
  function rowsFromXlsx(files) {
    var fflate = window.fflate;
    var shared = [];
    if (files['xl/sharedStrings.xml']) {
      var sdoc = new DOMParser().parseFromString(fflate.strFromU8(files['xl/sharedStrings.xml']), 'application/xml');
      var sis = tags(sdoc, 'si');
      for (var i = 0; i < sis.length; i++) shared.push(allText(sis[i]));
    }
    var sheetPath = Object.keys(files)
      .filter(function (k) { return /^xl\/worksheets\/sheet\d+\.xml$/i.test(k); })
      .sort()[0];
    if (!sheetPath) return [];
    var wdoc = new DOMParser().parseFromString(fflate.strFromU8(files[sheetPath]), 'application/xml');
    var rowEls = tags(wdoc, 'row'), rows = [];
    for (var r = 0; r < rowEls.length; r++) {
      var cells = tags(rowEls[r], 'c'), row = [];
      for (var c = 0; c < cells.length; c++) {
        var cell = cells[c], ref = cell.getAttribute('r'), ci = ref ? colIndex(ref) : c;
        var t = cell.getAttribute('t'), val = '';
        if (t === 'inlineStr') { val = allText(cell); }
        else {
          var v = tags(cell, 'v')[0], raw = v ? v.textContent : '';
          val = (t === 's') ? (shared[parseInt(raw, 10)] || '') : raw; // 's' -> shared-strings index
        }
        if (ci >= 0) row[ci] = val;
      }
      rows.push(row);
    }
    return rows;
  }

  // From a 2-D array of rows, take the "Preferred Full Name" column (skips the header row).
  function namesFromRows(rows) {
    if (!rows || rows.length < 2) return [];
    var header = rows[0].map(function (h) { return (h || '').trim(); });
    var col = header.indexOf(NAME_HEADER);
    if (col < 0) throw new Error('Could not find a "' + NAME_HEADER + '" column — is that the form’s responses sheet?');
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var n = (rows[i][col] || '').trim();
      if (n) out.push(n);
    }
    return out;
  }

  function isXlsx(file) {
    return /\.xlsx$/i.test(file.name || '') || /spreadsheetml/i.test(file.type || '');
  }

  NameDeck.sheetImport = {
    // Read a downloaded responses sheet (CSV or XLSX) and resolve with [preferred names].
    readFile: function (file) {
      if (isXlsx(file)) {
        return loadFflate()
          .then(function () { return readArrayBuffer(file); })
          .then(function (buf) { return namesFromRows(rowsFromXlsx(window.fflate.unzipSync(new Uint8Array(buf)))); });
      }
      return readText(file).then(function (text) { return namesFromRows(parseCsv(text)); });
    },
    // Exposed for tests (pure, no file/network needed).
    parseCsv: parseCsv,
    rowsFromXlsx: rowsFromXlsx,
    namesFromRows: namesFromRows
  };
})();


/* ===== src/ui/app.js ===== */
// app.js — MVP: show a photo, reveal the name after a delay, then auto-advance to the
// next student. Delays are adjustable from the gear panel. Tap the card to reveal the
// name early; tap again to skip ahead.
//
// Teachers build their roster from the roster panel: paste/type student names and attach
// a photo to each, or bulk-import photos. It's saved on-device (see roster-store.js).
// Students with no photo yet fall back to a generated avatar, so a roster can be built
// names-first and photographed later. Before any students are added, the deck shows an
// empty state. State is in-memory + localStorage (a prototype choice). WEB-ONLY; SwiftUI later.

(function () {
  var ND = window.NameDeck;
  var app = document.querySelector('#app');

  var delay = 2;        // seconds before the name appears
  var gap = 1;          // seconds the name stays up before advancing to the next student
  var current = null;   // current student
  var revealTimer = null;
  var advanceTimer = null;
  var revealed = false;
  var paused = false;   // when paused, the deck stops auto-cycling and prev/next are usable
  var history = [];     // the students shown, in order (for prev/next navigation)
  var pos = -1;         // index of the current card within history

  var myRoster = ND.rosterStore.load(); // the teacher's own students (may be empty)
  var seq = 0;                          // helps make unique ids within a session

  // First-ever launch: seed a small demo roster of well-known historical figures so a brand-new
  // user immediately sees the app working (portrait -> name -> auto-advance). Real people are
  // used (not fictional characters) because their Wikipedia portraits are clean photos with no
  // name printed in them. Each portrait's image URL is resolved from Wikipedia once and stored
  // (see hydrateDemoPhotos), so both the card and the roster list show it; until then a generated
  // avatar stands in. It's saved like any roster — fully editable, and
  // "Clear All" removes it — and the one-time "seeded" flag means it's never re-added after the
  // user clears or edits their roster.
  var DEMO_ROSTER = [
    { name: 'Albert Einstein', wiki: 'Albert_Einstein' },
    { name: 'Marie Curie',     wiki: 'Marie_Curie' },
    { name: 'Rosa Parks',      wiki: 'Rosa_Parks' },
    { name: 'Frida Kahlo',     wiki: 'Frida_Kahlo' },
    { name: 'Amelia Earhart',  wiki: 'Amelia_Earhart' },
    { name: 'Nikola Tesla',    wiki: 'Nikola_Tesla' },
    { name: 'Mark Twain',      wiki: 'Mark_Twain' },
    { name: 'Grace Hopper',    wiki: 'Grace_Hopper' }
  ];
  if (!myRoster.length && !ND.rosterStore.seeded()) {
    myRoster = DEMO_ROSTER.map(function (c, i) {
      return { id: 'seed' + (i + 1), preferredName: c.name, photo: null, wiki: c.wiki, avatarSeed: c.name };
    });
    ND.rosterStore.saveMeta(myRoster);

  // Pick a student to quiz — weighted by each student's "appears" frequency (default 1),
  // and never the same one twice in a row. Only called when the roster is non-empty.
  function pick() {
    var list = myRoster;
    if (list.length === 1) return list[0];
    var pool = list.filter(function (s) { return !current || s.id !== current.id; });
    var total = 0;
    pool.forEach(function (s) { total += (s.weight || 1); });
    var r = Math.random() * total;
    for (var i = 0; i < pool.length; i++) {
      r -= (pool[i].weight || 1);
      if (r < 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  // ---- Confirmation dialog (in-app, styled) ----

  // Replace Roster with a Folder: clear everything, then import the picked folder. Supports the
  // "rename a file, then reload the whole folder" workflow as a single action.
  function onReplaceFolder(e) {
    var imgs = imageFilesOnly(e.target.files);
    e.target.value = '';
    if (!imgs.length) return;
    var doReplace = function () { myRoster = []; ND.rosterStore.clear(); importPhotos(imgs); };
    if (myRoster.length) {
