  // Export the whole roster (names + photos) as one file, so it can move to another device.
  function exportRoster() {
    if (!myRoster.length) { setImportStatus('Nothing to export yet — add students first.', 'error'); return; }
    ND.rosterStore.loadPhotos().then(function (photos) {
      var data = { app: 'namedeck', version: 1, students: myRoster.map(function (s) {
        return { preferredName: s.preferredName, avatarSeed: s.avatarSeed, weight: s.weight, wiki: s.wiki,
          photo: s.photo || photos[s.id] || null };
      }) };
      var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'namedeck-roster.json'; // .json is selectable in every file picker
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      setImportStatus('Exported ' + data.students.length + ' student' + (data.students.length === 1 ? '' : 's') + ' ✓', 'ok');
    });
  }

  // Import a roster file (from Export above) — replaces the current roster with its contents.
  function onRosterFilePicked(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try { data = JSON.parse(String(reader.result)); } catch (err) { /* not JSON */ }
      if (!data || data.app !== 'namedeck' || !Array.isArray(data.students)) {
        setImportStatus('That doesn’t look like a NameDeck roster file.', 'error');
        return;
      }
      var apply = function () {
        myRoster = [];
        ND.rosterStore.clear();
        data.students.forEach(function (st) {
          var id = 'r' + (++seq);
          var stud = { id: id, preferredName: st.preferredName || 'Student',
            avatarSeed: st.avatarSeed || st.preferredName, weight: st.weight, wiki: st.wiki, photo: st.photo || null };
          myRoster.push(stud);
          if (stud.photo) ND.rosterStore.savePhoto(id, stud.photo);
        });
        save();
        renderList();
        setImportStatus('Loaded ' + myRoster.length + ' student' + (myRoster.length === 1 ? '' : 's') + ' from the file ✓', 'ok');
      };
      if (myRoster.length) {
        askConfirm('Replace all ' + myRoster.length + ' student' + (myRoster.length === 1 ? '' : 's') +
          ' with this file?', 'Replace', apply);
      } else { apply(); }
    };
    reader.onerror = function () { setImportStatus('Could not read that file.', 'error'); };
    reader.readAsText(file);
  }

  // Turn a photo's file name into a student name: "Will Smith.jpg" -> "Will Smith".
  // Google Forms names each uploaded file "<original name> - <Student's Full Name>.<ext>" (the
  // student's own Google account name), e.g. "IMG_0333 - Dana Prem.jpeg". So if that " - " separator
  // is present we keep only the part after the LAST one (the name). Otherwise it's a hand-named file
  // ("Will Smith.jpg"), which we tidy up. Pure, portable logic — identical on iOS.
  function nameFromFilename(filename) {
    var base = String(filename).replace(/^.*[\\/]/, '') // drop any folder path
      .replace(/\.[^.]+$/, '');                          // drop the extension
    if (base.indexOf(' - ') !== -1) {                    // Google Forms download: keep the name part
      base = base.slice(base.lastIndexOf(' - ') + 3);    // after the LAST " - " (so a UUID's hyphens are safe)
    } else {                                             // hand-named file: underscores -> spaces
      base = base.replace(/_+/g, ' ');
    }
    base = base.replace(/\s*\(\d+\)\s*$/, '')            // drop a downloaded-duplicate " (1)" suffix (either path)
      .replace(/\s+/g, ' ').trim();
    return base || 'Student';
  }

  // SEAM 1 (file pick + read): on the web the OS file dialog hands us File objects here.
  // On iOS this same entry point is fed by PhotosPicker / the document picker instead.
  function onImportPhotos(e) {
    importPhotos(e.target.files);
    e.target.value = ''; // let the same files be re-picked later
  }

  // Folder picker (webkitdirectory) returns every file in the folder, so keep images only.
  function imageFilesOnly(fileList) {
    return Array.prototype.slice.call(fileList || []).filter(function (f) {
      return /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|bmp|heic|heif|avif|tiff?)$/i.test(f.name);
    });
  }
  function onImportFolder(e) {
    importPhotos(imageFilesOnly(e.target.files));
    e.target.value = '';
  }

  // Bulk import: one student per photo, name taken from the file name. Photos decode
  // asynchronously, so the rows appear immediately and fill in as each finishes.
  function importPhotos(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return;
    var pending = list.length, undecoded = [];
    list.forEach(function (file) {
      var name = nameFromFilename(file.name);
      var student = { id: 'r' + (++seq), preferredName: name, photo: null, avatarSeed: name };
      myRoster.push(student);
      // SEAM 2 (image resize/encode): canvas on web, ImageIO/UIImage on iOS.
      fileToPhoto(file, function (dataUrl, decoded) {
        student.photo = dataUrl;
        if (!decoded) undecoded.push(name); // couldn't render here (usually HEIC on a desktop browser)
        // SEAM 3 (storage): metadata -> localStorage, the photo -> IndexedDB (see roster-store).
        ND.rosterStore.savePhoto(student.id, dataUrl).then(function (ok) { if (!ok) showStorageNotice(true); });
        if (--pending === 0) { // all decoded: persist metadata once, refresh, and warn about any HEICs
          save();
          renderList();
          if (undecoded.length) { // rare now that HEIC is converted — a corrupt file, or the decoder couldn't load offline
            setImportStatus(undecoded.length + ' photo' + (undecoded.length === 1 ? '' : 's') +
              " couldn't be read (they may be corrupt, or a HEIC couldn't be converted): " +
              undecoded.slice(0, 6).join(', ') + (undecoded.length > 6 ? '…' : ''), 'error');
          }
        }
      });
    });
    renderList(); // show the new students right away (names + placeholder) while photos decode
    showPreferredCallout(); // nudge toward the sheet-name upgrade (dismissible; quiet once used)
  }

  function setImportStatus(msg, kind) {
    var el = document.querySelector('#importStatus');
    el.textContent = msg;
    el.className = 'import-status' + (kind ? ' ' + kind : '');
    el.hidden = false;
  }

  // Import from Google (Forms responses) via the Picker — names matched to photos by file ID.
  function onImportGoogle() {
    if (!ND.googleImport || !ND.googleImport.configured()) {
      setImportStatus("Google import isn't set up yet — add your credentials in google-import.js.", 'error');
      return;
    }
    if (isNative()) { startNativeGoogleImport(); return; } // native: sign in via the real browser
    setImportStatus('Connecting to Google…', '');
    ND.googleImport.run(function (msg) { setImportStatus(msg, ''); }).then(function (result) {
      var students = (result && result.students) || [];
      var failed = (result && result.failed) || 0;
      students.forEach(function (s) {
        var stud = { id: 'r' + (++seq), preferredName: s.preferredName, photo: null, avatarSeed: s.preferredName };
        myRoster.push(stud);
        fileToPhoto(s.blob, function (dataUrl) { stud.photo = dataUrl; ND.rosterStore.savePhoto(stud.id, dataUrl); save(); renderList(); });
      });
      save();
      renderList();
      if (!students.length) {
        setImportStatus('No photos could be imported' + (failed ? ' (' + failed + ' failed)' : '') + '. ' +
          (result && result.firstError ? result.firstError : ''), 'error');
      } else if (failed) {
        setImportStatus('Imported ' + students.length + ' of ' + (students.length + failed) + '. ' + failed +
          ' photo' + (failed === 1 ? '' : 's') + ' failed — ' + (result.firstError || 'not accessible') + '.', 'error');
      } else {
        setImportStatus('Imported ' + students.length + ' student' + (students.length === 1 ? '' : 's') + ' ✓', 'ok');
      }
    }).catch(function (err) {
      setImportStatus('Import failed: ' + (err && err.message ? err.message : err), 'error');
    });
  }

  // Add preferred names ("Local Google"): the teacher picks their DOWNLOADED responses sheet (.csv
  // or .xlsx — no Google connection, works offline and on .edu), and we upgrade the imported
  // filename-derived names to each student's preferred name. Photos are untouched; only labels
  // change. See sheet-import.js for the file reading and applyPreferredNames for the matching.
  function onSheetFilePicked(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = ''; // let the same file be re-picked later
    if (!file) return;
    if (!myRoster.length) {
      setImportStatus('Import photos first, then add preferred names from your sheet.', 'error');
      return;
    }
    setImportStatus('Reading names…', '');
    ND.sheetImport.readFile(file).then(function (names) {
      if (!names || !names.length) {
        setImportStatus('No names found in that file — is it the form’s responses sheet?', 'error');
        return;
      }
      var res = applyPreferredNames(myRoster, names);
      save();
      renderList();
      if (!res.upgraded) {
        setImportStatus('Read ' + names.length + ' name' + (names.length === 1 ? '' : 's') +
          ', but none matched your photos by name — names left as-is (you can edit any by hand).', 'error');
      } else {
        setImportStatus('Updated ' + res.upgraded + ' name' + (res.upgraded === 1 ? '' : 's') + ' to the preferred version ✓' +
          (res.unmatched ? ' — ' + res.unmatched + ' left as the photo’s name' : ''), 'ok');
      }
    }).catch(function (err) {
      setImportStatus('Could not read that sheet: ' + (err && err.message ? err.message : err), 'error');
    });
  }

  // Normalize a name for comparison only: drop accents, lowercase, collapse to single-spaced words.
  // (Turkish "Yağmur Ağı" and a plain "Yagmur Agi" compare equal — good enough as a match key, and
  // both sides go through the same funnel so consistency, not fidelity, is what matters.)
  function normName(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  // Upgrade imported (filename) names to the sheet's preferred names, in two passes:
  //   1) exact normalized full-name match (only when that name is unique on the sheet) — fixes
  //      casing/accents and keeps the two Emmas on their own rows.
  //   2) last-name anchor for whatever's left — applies a nickname (robbie -> Robert Mungovan,
  //      Brianna -> Bri Eubank) ONLY when that last name is unique among BOTH the remaining students
  //      and the remaining sheet entries, so a wrong name is never pinned to a face.
  // Pass 1 runs first so that, e.g., an exact "Sarah Mungovan" is consumed before pass 2 tries to
  // resolve "robbie mungovan", leaving it unambiguous. Returns { upgraded, unmatched }.
  function lastToken(norm) { var p = norm.split(' '); return p[p.length - 1]; }
  function applyPreferredNames(roster, sheetNames) {
    var sheet = sheetNames.map(function (n) { return { name: n, norm: normName(n), used: false }; })
      .filter(function (e) { return e.norm; });
    var normFreq = {};
    sheet.forEach(function (e) { normFreq[e.norm] = (normFreq[e.norm] || 0) + 1; });

    var upgraded = 0, pending = [];
    roster.forEach(function (s) {                         // pass 1: exact, unambiguous full name
      var k = normName(s.preferredName), e = null, i;
      if (normFreq[k] === 1) {
        for (i = 0; i < sheet.length; i++) { if (!sheet[i].used && sheet[i].norm === k) { e = sheet[i]; break; } }
      }
      if (e) { e.used = true; if (e.name !== s.preferredName) { s.preferredName = e.name; upgraded++; } }
      else pending.push(s);
    });

    var unmatched = 0;
    pending.forEach(function (s) {                        // pass 2: unique last-name anchor (nicknames)
      var ln = lastToken(normName(s.preferredName));
      var cands = sheet.filter(function (e) { return !e.used && lastToken(e.norm) === ln; });
      var rivals = pending.filter(function (o) { return lastToken(normName(o.preferredName)) === ln; });
      if (ln && cands.length === 1 && rivals.length === 1) {
        cands[0].used = true;
        if (cands[0].name !== s.preferredName) { s.preferredName = cands[0].name; upgraded++; }
      } else { unmatched++; }
    });
    return { upgraded: upgraded, unmatched: unmatched };
  }
  // Expose pure helpers for the test suite (no Google/network/image-decoding needed to exercise them).
  ND.matchPreferredNames = applyPreferredNames;
  ND.isHeic = function (file) { return isHeic(file); };
  ND.isTiff = function (file) { return isTiff(file); };

  // ---- Native "Import from Google" (Capacitor iOS) ----
  // Google refuses to run its sign-in inside an app's webview, so the native flow opens the
  // handoff page (native-import.html) in the real browser; that page signs in + picks + reads
  // the sheet, then returns via a namedeck:// link carrying the token + {name, fileId} list.
  // We finish here by downloading the photos with that token. See setupDeepLinks / finishNative.
  var NATIVE_IMPORT_URL = 'https://namedeck.pages.dev/native-import.html';
  var PRIVACY_URL = 'https://namedeck.pages.dev/privacy.html';

  function isNative() {
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  }

  // Open the privacy page. On the web the anchor's target=_blank handles it; natively we open
  // the system browser (with a Done button) so the app's own webview isn't navigated away.
  function onPrivacyClick(e) {
    if (isNative()) {
      e.preventDefault();
      try { window.Capacitor.Plugins.Browser.open({ url: PRIVACY_URL }); } catch (err) { /* ignore */ }
    }
  }

  function startNativeGoogleImport() {
    setImportStatus('Opening Google sign-in in your browser…', '');
    try {
      window.Capacitor.Plugins.Browser.open({ url: NATIVE_IMPORT_URL });
    } catch (e) {
      setImportStatus('Could not open the browser for Google sign-in.', 'error');
    }
  }

  // Register the namedeck:// deep-link listener that the handoff page returns to.
  function setupDeepLinks() {
    if (!isNative()) return;
    var App = window.Capacitor.Plugins.App;
    if (!App || !App.addListener) return;
    App.addListener('appUrlOpen', function (data) {
      var url = data && data.url;
      if (!url || url.indexOf('namedeck://import') !== 0) return;
      try { window.Capacitor.Plugins.Browser.close(); } catch (e) {} // dismiss the browser sheet
      finishNativeGoogleImport(url);
    });
  }

  function finishNativeGoogleImport(url) {
    if (document.querySelector('#rosterSheet').hidden) openRoster(); // show the status + new rows
    var frag = url.split('#')[1] || '';
    var payload = null;
    try { payload = JSON.parse(decodeURIComponent(frag)); } catch (e) { /* malformed */ }
    if (!payload || !payload.students || !payload.students.length) {
      setImportStatus('No students were imported.', '');
      return;
    }
    var token = payload.token, students = payload.students;
    var total = students.length, done = 0, ok = 0, firstError = null;
    var progress = function () {
      done++;
      if (done < total) { setImportStatus('Downloading photos… (' + done + ' of ' + total + ')', ''); return; }
      save(); renderList();
      if (ok === 0) {
        // Nothing downloaded — surface the real reason instead of silently showing avatars.
        setImportStatus('Found ' + total + ' student' + (total === 1 ? '' : 's') +
          ' but couldn’t download any photos. ' +
          (firstError || 'The photos may not be accessible.'), 'error');
      } else if (ok < total) {
        setImportStatus('Imported ' + ok + ' of ' + total + '. ' + (total - ok) + ' photo' + ((total - ok) === 1 ? '' : 's') +
          ' failed — ' + (firstError || 'not accessible') + '.', 'error');
      } else {
        setImportStatus('Imported ' + total + ' student' + (total === 1 ? '' : 's') + ' ✓', 'ok');
      }
    };
    students.forEach(function (s) {
      var stud = { id: 'r' + (++seq), preferredName: s.preferredName, photo: null, avatarSeed: s.preferredName };
      myRoster.push(stud);
      ND.googleImport.downloadPhoto(s.fileId, token).then(function (blob) {
        fileToPhoto(blob, function (dataUrl) { stud.photo = dataUrl; ND.rosterStore.savePhoto(stud.id, dataUrl); ok++; save(); renderList(); progress(); });
      }, function (err) { if (!firstError) firstError = (err && err.message) ? err.message : String(err); progress(); });
    });
    save();
    renderList();
    setImportStatus('Downloading photos… (0 of ' + total + ')', '');
  }

  function clearRoster() {
    askConfirm("Remove all students from your roster? This can't be undone.", 'Clear All', function () {
      myRoster = [];
      ND.rosterStore.clear();
      renderList();
    });
  }

  function renderList() {
    var el = document.querySelector('#rosterList');
    var countEl = document.querySelector('#rosterCount');
    if (countEl) countEl.textContent = myRoster.length ? '(' + myRoster.length + ')' : '';
    if (!myRoster.length) {
      el.innerHTML = '<div class="empty">No students yet — import photos above.</div>';
      return;
    }
    el.innerHTML = myRoster.map(function (s) {
      // Always render the avatar; overlay the photo on top, so a failed image reveals the avatar.
      var thumb = ND.avatar(s.avatarSeed || s.preferredName, 44) +
        (s.photo ? '<img class="rthumb-photo" src="' + escapeHtml(s.photo) + '" alt="" />' : '');
      return '<div class="rrow" data-id="' + escapeHtml(s.id) + '">' +
          '<div class="rthumb">' + thumb + '</div>' +
          '<input class="rname" value="' + escapeHtml(s.preferredName) + '" aria-label="Student name" readonly />' +
          '<button class="btn tiny edit">Edit</button>' +
          '<button class="btn tiny remove" aria-label="Remove">&times;</button>' +
        '</div>';
    }).join('');
    // If a photo URL fails to load, drop it so the avatar underneath shows (no broken-image icon).
    Array.prototype.forEach.call(el.querySelectorAll('.rthumb-photo'), function (img) {
      img.onerror = function () { img.remove(); };
    });
  }

  function rowStudent(target) {
    var row = target.closest && target.closest('.rrow');
    if (!row) return null;
    var id = row.getAttribute('data-id');
    for (var i = 0; i < myRoster.length; i++) {
      if (String(myRoster[i].id) === String(id)) return myRoster[i];
    }
    return null;
  }

  function onListInput(e) {
    if (!e.target.classList || !e.target.classList.contains('rname')) return;
    var s = rowStudent(e.target);
    if (!s) return;
    s.preferredName = e.target.value;         // don't re-render here: it would drop the cursor
    save();
  }
  function onListClick(e) {
    // Edit: unlock this row's name field so a mistyped name can be corrected.
    var edit = e.target.closest && e.target.closest('.edit');
    if (edit) {
      var input = edit.closest('.rrow').querySelector('.rname');
      input.removeAttribute('readonly');
      input.focus();
      input.select();
      return;
    }
    // Remove: drop this student from the roster.
    var rm = e.target.closest && e.target.closest('.remove');
    if (!rm) return;
    var row = rm.closest('.rrow');
    var id = row && row.getAttribute('data-id');
    myRoster = myRoster.filter(function (s) { return String(s.id) !== String(id); });
    ND.rosterStore.removePhoto(id); // drop its photo from IndexedDB too
    save();
    renderList();
  }

  // Leaving the field (blur) finishes the edit and locks it again.
  function onListFocusOut(e) {
    if (!e.target.classList || !e.target.classList.contains('rname')) return;
    if (e.target.hasAttribute('readonly')) return;
    e.target.setAttribute('readonly', '');
    save();
  }
  // Enter finishes editing (blurs the field).
  function onListKeydown(e) {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('rname')) {
      e.preventDefault();
      e.target.blur();
    }
  }

  // Persist the small roster metadata (names, etc.). Photos are saved separately to IndexedDB at
  // the moment they're added (see savePhoto calls), so they don't ride along in every save.
  function save() { return ND.rosterStore.saveMeta(myRoster); }

  function showStorageNotice(show) {
    var n = document.querySelector('#storageNotice');
    if (n) n.hidden = !show;
  }

  // HEIC (Apple's iPhone photo format) can't be decoded by Chrome/Firefox/Edge, only Safari. We
  // detect it and convert to JPEG with a decoder that's loaded lazily (only when a HEIC is actually
  // imported), so the app stays dependency-free for everyone else. On an iPhone the OS already hands
  // us JPEG when picking from Photos, so this mainly matters for desktop / downloaded-folder imports.
  function isHeic(file) {
    return /^image\/hei[cf]$/i.test((file && file.type) || '') || /\.hei[cf]$/i.test((file && file.name) || '');
  }
  function isTiff(file) {
    return /^image\/tiff$/i.test((file && file.type) || '') || /\.tiff?$/i.test((file && file.name) || '');
  }
  // Load a vendored decoder script on demand (once), resolving with the global it exposes.
  function loadVendor(state, src, globalName) {
    if (window[globalName]) return Promise.resolve(window[globalName]);
    if (state.p) return state.p;
    state.p = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { resolve(window[globalName]); };
      s.onerror = function () { state.p = null; reject(new Error('Could not load ' + src)); };
      document.head.appendChild(s);
    });
    return state.p;
  }
  var heicState = {}, tiffState = {};
  function readArrayBuffer(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsArrayBuffer(file);
    });
  }
  // TIFF -> JPEG Blob: decode with UTIF into RGBA pixels, paint to a canvas, re-encode as JPEG so it
  // flows through the normal (downscaling) pipeline like any other image.
  function convertTiff(file) {
    return loadVendor(tiffState, 'vendor/utif.min.js', 'UTIF').then(function (UTIF) {
      return readArrayBuffer(file).then(function (buf) {
        var ifds = UTIF.decode(buf);
        UTIF.decodeImage(buf, ifds[0], ifds);
        var page = ifds[0], rgba = UTIF.toRGBA8(page);
        var canvas = document.createElement('canvas');
        canvas.width = page.width; canvas.height = page.height;
        var ctx = canvas.getContext('2d');
        var imgData = ctx.createImageData(page.width, page.height);
        imgData.data.set(rgba);
        ctx.putImageData(imgData, 0, 0);
        return new Promise(function (resolve) {
          canvas.toBlob(function (b) { resolve(b || file); }, 'image/jpeg', 0.92);
        });
      });
    });
  }
  // Hand back a Blob the browser can actually decode: HEIC and TIFF are converted to JPEG on the fly
  // (via lazily-loaded decoders); everything else passes straight through. Any failure falls back to
  // the original file (which then surfaces as the "couldn't be read" notice rather than a crash).
  function toDecodable(file) {
    if (isHeic(file)) {
      return loadVendor(heicState, 'vendor/heic2any.min.js', 'heic2any')
        .then(function (heic2any) { return heic2any({ blob: file, toType: 'image/jpeg', quality: 0.82 }); })
        .then(function (out) { return Array.isArray(out) ? out[0] : out; })
        .catch(function () { return file; });
    }
    if (isTiff(file)) return convertTiff(file).catch(function () { return file; });
    return Promise.resolve(file);
  }

  // Read an image file, downscale it, and hand back a JPEG data URL. The cap (640px) keeps each
  // photo small (~50–70 KB) so a full class fits in on-device storage, while still looking sharp on
  // a flashcard. Never upscales past the original (scale is clamped to 1). cb(dataUrl, decoded):
  // decoded=false means the browser couldn't render it (we still store the original as a fallback).
  function fileToPhoto(file, cb) {
    toDecodable(file).then(function (blob) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 640;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          try {
            var ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, w, h);
            cb(canvas.toDataURL('image/jpeg', 0.72), true);
          } catch (e) {
            cb(reader.result, true); // canvas unavailable (e.g. tests) — the data URL is still valid
          }
        };
        img.onerror = function () { cb(reader.result, false); }; // undecodable even after conversion
        img.src = reader.result;
      };
      reader.readAsDataURL(blob);
    });
  }

  // ---- Flashcard ----
  // Rebuild the deck from scratch (used when the roster changes): fresh history, but keep
  // the current play/pause state (so closing the roster doesn't force it back to playing).
  function refreshDeck() {
    clearTimers();
    history = [];
    pos = -1;
    if (myRoster.length) { updateControls(); nextCard(); }
    else showEmpty();
  }

  // Resume the current card in place (after the settings sheet closes) without resetting.
  function resumeDeck() {
    clearTimers();
    showTransport(true);
    updateControls();
    renderNameSlot();
    if (!paused) armForState();
  }

  function showEmpty() {
    current = null;
    revealed = false;
    showTransport(false);
    document.querySelector('#freq').hidden = true;
    document.querySelector('#avatar').innerHTML =
      '<div class="empty-deck">' +
        '<div class="empty-title">No students yet</div>' +
        '<div class="empty-sub">Add your class to start studying their names.</div>' +
        '<button class="btn primary" id="emptyAdd">Add roster</button>' +
      '</div>';
    document.querySelector('#nameSlot').innerHTML = '';
    document.querySelector('#emptyAdd').addEventListener('click', function (ev) {
      ev.stopPropagation(); // don't also trigger the card tap
      openRoster();
    });
  }

  function showCard(p) {
    current = p;
    revealed = false;
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    showTransport(true);
    var av = document.querySelector('#avatar');
    av.innerHTML = '';
    var fallback = function () {
      if (current === p) av.innerHTML = ND.avatar(p.avatarSeed || p.preferredName, 320);
    };
    if (p.photo) {
      var img = document.createElement('img');
      img.className = 'photo'; img.alt = 'portrait';
      img.onerror = fallback;
      img.src = p.photo;
      av.appendChild(img);
    } else {
      fallback(); // no photo yet (a named student, or a demo portrait still downloading)
    }
    renderNameSlot();
    updateControls();
    if (!paused) armReveal();
  }

  // Resolve each demo student's Wikipedia portrait URL once and store it as their photo, so both
  // the flashcard and the roster list show it via a plain <img src> (which loads cross-origin
  // without CORS — unlike fetching the bytes, which the iOS webview blocks). Runs on every load
  // but only for demo students still missing a photo, so it also retries any that failed before.
  function hydrateDemoPhotos() {
    if (typeof fetch !== 'function') return;
    myRoster.filter(function (s) { return s.wiki && !s.photo; }).forEach(function (s) {
      fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(s.wiki))
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (data) {
          var src = data && data.thumbnail && data.thumbnail.source;
          if (!src) return;
          s.photo = src; // store the portrait URL (loaded by <img> on the card and in the list)
          save();
          if (!document.querySelector('#rosterSheet').hidden) renderList(); // update the list if open
          if (current && current.id === s.id) swapCardPhoto(s);            // update the shown card in place
        })
        .catch(function () { /* keep the avatar; retry on the next launch */ });
    });
  }

  // Swap the current card's image in place (no reveal/timer reset), with an avatar fallback.
  function swapCardPhoto(p) {
    var av = document.querySelector('#avatar');
    if (!av || current !== p) return;
    av.innerHTML = '';
    var img = document.createElement('img');
    img.className = 'photo'; img.alt = 'portrait';
    img.onerror = function () { if (current === p) av.innerHTML = ND.avatar(p.avatarSeed || p.preferredName, 320); };
    img.src = p.photo;
    av.appendChild(img);
  }

  // Render the name slot for the current state (hidden vs revealed, playing vs paused).
  function renderNameSlot() {
    var slot = document.querySelector('#nameSlot');
    if (!current) { slot.innerHTML = ''; return; }
    if (revealed) {
      slot.innerHTML = '<div class="name">' + escapeHtml(current.preferredName) + '</div>' +
        (paused ? '' : '<div class="waiting">tap or wait…</div>');
    } else {
      slot.innerHTML = '<div class="waiting">' + (paused ? 'tap to reveal' : 'tap or wait…') + '</div>';
    }
  }

  function armReveal() {
    if (revealTimer) clearTimeout(revealTimer);
    revealTimer = setTimeout(reveal, delay * 1000);
  }

  function armAdvance() {
    if (advanceTimer) clearTimeout(advanceTimer);
    advanceTimer = setTimeout(nextCard, gap * 1000);
  }

  function armForState() {   // resume the cycle from wherever the current card is
    if (paused || !current) return;
    if (revealed) armAdvance(); else armReveal();
  }

  function clearTimers() {
    if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }

  function reveal() {
    if (!current || revealed) return;
    revealed = true;
    if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
    renderNameSlot();
    if (!paused) armAdvance();
  }

  // ---- Playback controls ----
  function togglePause() { setPaused(!paused); }
  function setPaused(p) {
    paused = p;
    if (paused) clearTimers();
    updateControls();
    renderNameSlot();
    if (!paused) armForState();
  }
  function showTransport(show) { document.querySelector('#transport').hidden = !show; }
  function updateControls() {
    var pp = document.querySelector('#playPause');
    pp.innerHTML = paused ? PLAY_SVG : PAUSE_SVG;
    pp.setAttribute('aria-label', paused ? 'Continue' : 'Pause');
    // Prev/Next step through cards, and are only usable while paused.
    document.querySelector('#prevCard').disabled = !paused || pos <= 0;
    document.querySelector('#nextCard').disabled = !paused;
    // The frequency selector is only shown while paused (there's no time to use it mid-cycle).
    document.querySelector('#freq').hidden = !(paused && current);
    renderFreq();
  }

  // Highlight the current student's "appears" level in the frequency selector.
  function renderFreq() {
    var seg = document.querySelector('#freqSeg');
    var w = current ? (current.weight || 1) : 1;
    var opts = seg.querySelectorAll('.freq-opt');
    for (var i = 0; i < opts.length; i++) {
      var active = parseFloat(opts[i].getAttribute('data-w')) === w;
      opts[i].classList.toggle('active', active);
      opts[i].setAttribute('aria-pressed', active ? 'true' : 'false');
    }
  }

  // Set how often the current student appears (a weight for the weighted pick).
  function onFreqClick(e) {
    var btn = e.target.closest && e.target.closest('.freq-opt');
    if (!btn || !current) return;
    current.weight = parseFloat(btn.getAttribute('data-w'));
    save();
    renderFreq();
  }

  // Tap the card: reveal the name; when playing, a second tap skips ahead.
  function onCardTap() {
    if (paused) { if (!revealed) reveal(); return; }
    if (revealed) nextCard(); else reveal();
  }

  // Advance: step forward through history, or draw a new student at the end.
  function nextCard() {
    if (pos < history.length - 1) { pos++; }
    else { history.push(pick()); pos = history.length - 1; }
    showCard(history[pos]);
  }
  // Step back to a previously-shown card (only meaningful while paused).
  function prevCard() {
    if (pos > 0) { pos--; showCard(history[pos]); }
  }

  render();
  setupDeepLinks();    // listen for the namedeck:// handoff (native only; no-op on the web)

  // Photos live in IndexedDB (metadata rendered instantly above). Load them after the first paint,
  // fill them into the roster, then hydrate any remaining demo portraits (which only touch students
  // still without a photo).
  ND.rosterStore.loadPhotos().then(function (photos) {
    myRoster.forEach(function (s) { if (!s.photo && photos[s.id]) s.photo = photos[s.id]; });
    if (!document.querySelector('#rosterSheet').hidden) renderList();
    if (current && current.photo) swapCardPhoto(current);
  }).catch(function () {}).then(function () {
    hydrateDemoPhotos(); // fill in the demo roster's Wikipedia portraits (for students still without a photo)
  });
})();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
