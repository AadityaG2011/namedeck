name: Deploy to GitHub Pages

# Builds dist/ with build.js and publishes it to GitHub Pages on every push to main.
# Enable once in the repo: Settings → Pages → Build and deployment → Source → "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js          # zero-dependency build (no npm install needed)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
